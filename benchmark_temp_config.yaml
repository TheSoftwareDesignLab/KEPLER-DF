simulation:
  num_scenarios: 5
  seed: 0
  semantic_enabled: false
  export_kml_visualization: true
  dataset_name: DS_01_WD_Small_Clustered
  constellation_type: Walker Delta
  sat_k: 8
  gs_k: 3
  tasks_k: 150
  walker_params:
    t: 8
    p: 2
    f: 1
    altitude_km: 550.0
    inc: 53.0
    base_id: 90000
payload:
  sensors_pool:
  - OPT
  - SAR
  sensor_weights:
  - 0.6
  - 0.4
  sensor_generation_rates:
    OPT: 80.0
    SAR: 40.0
  sensor_constraints:
    SAR:
      max_look_angle_deg: 40.0
    OPT:
      max_look_angle_deg: 30.0
  storage_capacity_pool_mb:
  - 128000.0
  - 512000.0
  storage_capacity_weights:
  - 0.6
  - 0.7
  bands_config:
    X:
      weight: 0.6
      min_elevation_deg: 8.0
      max_slant_range_km: 2200.0
      downlink_rate_mb_s: 45.0
    S:
      weight: 0.2
      min_elevation_deg: 5.0
      max_slant_range_km: 2600.0
      downlink_rate_mb_s: 2.0
  min_sensors_per_sat: 1
  max_sensors_per_sat: 2
task_generation:
  polygon_ratio: 0.6
  min_area_deg: 0.05
  max_area_deg: 0.2
  min_duration: 5
  max_duration: 30
  min_release_delay: 0
  max_release_delay: 600
  min_lifetime: 1900
  max_lifetime: 86400
  priority_weights:
  - 0.5
  - 0.3
  - 0.2
  bounding_boxes:
  - name: andean_latam
    lat_envelope:
    - -5.0
    - 12.0
    lon_envelope:
    - -80.0
    - -65.0
  - name: western_europe
    lat_envelope:
    - 35.0
    - 55.0
    lon_envelope:
    - -10.0
    - 20.0
  - name: southeast_asia
    lat_envelope:
    - -10.0
    - 15.0
    lon_envelope:
    - 95.0
    - 130.0
  - name: north_america_conus
    lat_envelope:
    - 25.0
    - 50.0
    lon_envelope:
    - -125.0
    - -70.0
paths:
  gs_file_path: data/ground_station.csv
  sat_file_path: data/satellite_tle.csv
